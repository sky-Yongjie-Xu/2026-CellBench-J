data_cfg:
  dataset_name: pbmc12k
  data_path: datasets
  root_path: datasets
  num_workers: 1
  split_field: split
  spilt_name:
  - train
  - vaild
  - test
  - all
  label_fields:
  - celltype
  covariate_fields: null
  ensembl_auto_conversion: true
  hvg: 3000
  test_dataset_name: pbmc12k
  batch_size: 32
model_cfg:
  model: Tabula
  tasks: annotation
  ckpt_path: weights/Tabula/pancreas.pth
  vocab_file: weights/Tabula/vocab.json
  config_file: weights/Tabula/finetune_framework_annotation.yaml
  pretrained_backbone: FlashAttention
  n_bins: 51
  in_feature: 1200
  weights_dir: weights/Tabula
  source_dir: public_code/Tabula
  expression_layer: auto
  inference_batch_size: 32
trainer_cfg:
  enable_float16: true
  with_test: false
  fix_BN: false
  log_iter: 100
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 0
  save_iter: 2000
  save_name: tmp
  sync_BN: false
  total_iter: 80000
  sampler:
    batch_shuffle: false
    batch_size:
    - 8
    - 16
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
  - type: BaseSilCuttingTransform
