data_cfg:
  dataset_name: pbmc12k
  data_path: datasets
  root_path: datasets
  num_workers: 1
  split_field: split
  spilt_name:
  - train
  - test
  - vaild
  label_fields:
  - celltype
  covariate_fields: null
  ensembl_auto_conversion: true
  hvg: 3000
  test_dataset_name: pbmc12k
model_cfg:
  model: scMulan
  ckpt_path: weights/scMulan/ckpt_scMulan.pt
  meta_info_path: weights/scMulan/meta_info.pt
  tasks: cluster
  pretrain_prefix: 20230926_85M
  pretrain_directory: weights/CellPLM
  weights_dir: weights/scMulan
  source_dir: public_code/scMulan
  expression_layer: auto
  inference_batch_size: 8
trainer_cfg:
  enable_float16: true
  with_test: false
  fix_BN: false
  log_iter: 100
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 0
  save_iter: 2000
  save_name: tmp
  sync_BN: false
  total_iter: 80000
  sampler:
    batch_shuffle: false
    batch_size:
    - 8
    - 16
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
  - type: BaseSilCuttingTransform
