data_cfg:
  dataset_name: pbmc12k
  data_path: datasets
  root_path: datasets
  num_workers: 1
  label_fields:
  - celltype
  output_directory: /root/commusim/benchmark/bio/out
  output_prefix: MS_adata
  cell_state_dict:
    state_key: celltype
    states: all
  rare_threshold: 0
  max_ncells: null
  max_ncells_per_class: null
  gene_class_dict: null
  training_args: null
  freeze_layers: null
  hvg: 3000
  test_dataset_name: pbmc12k
model_cfg:
  model: Geneformer
  token_dictionary_file: weights/Geneformer/token_dictionary_gc30M.pkl
  gene_median_file: weights/Geneformer/gene_median_dictionary_gc30M.pkl
  tasks: cluster
  pretrain_prefix: 20230926_85M
  model_type: Pretrained
  out_dim: 18
  pretrain_directory: weights/Geneformer/gf-12L-30M-i2048
  weights_dir: weights/Geneformer
  source_dir: public_code/Geneformer
  expression_layer: auto
  inference_batch_size: 8
